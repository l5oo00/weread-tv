distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 发行包改走腾讯云镜像，国内 clone 后首次构建无需手动换源。
# 如需回退官方源，把下一行改回 https://services.gradle.org/distributions/gradle-8.9-bin.zip
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip
# 官方 https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256 的值。
# 镜像与官方是同一个 zip，所以本地走镜像、CI 切官方源时校验值都适用。
distributionSha256Sum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
